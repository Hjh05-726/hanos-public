name: Public package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate public manifest
        run: python scripts/release.py check
      - name: Run public regressions
        run: python -m unittest discover -s tests -v
      - name: Whitespace and clean-source check
        run: git diff --check
      - name: Build versioned archive
        run: python scripts/release.py build --output "$RUNNER_TEMP/hanos-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hanos-${{ matrix.os }}-python-${{ matrix.python }}
          path: ${{ runner.temp }}/hanos-release/
          retention-days: 14
          if-no-files-found: error
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify official scanner download and scan history
        shell: bash
        run: |
          set -euo pipefail
          scan_dir=$(mktemp -d)
          cd "$scan_dir"
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --location --retry 3 "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o scanner.tar.gz
          curl --fail --location --retry 3 "$base/gitleaks_8.30.1_checksums.txt" -o checksums.txt
          expected=$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' checksums.txt)
          test -n "$expected"
          printf '%s  scanner.tar.gz\n' "$expected" | sha256sum --check
          tar -xzf scanner.tar.gz gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --log-opts=--all --redact --ignore-gitleaks-allow --no-banner
